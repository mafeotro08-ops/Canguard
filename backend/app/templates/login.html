<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANGUARD - Tactical Portal</title>
    <style>
        :root {
            --primary: #FFD700; /* Oro Eléctrico Brillante */
            --accent: #00f2ff; /* Cyan Neón */
            --bg-dark: #020810;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #0a1e30 0%, #020810 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Rejilla Neón Animada */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(255, 215, 0, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            top: -50%;
            animation: moveGrid 12s linear infinite;
        }

        @keyframes moveGrid {
            from { background-position: 0 0; }
            to { background-position: 0 500px; }
        }

        .login-card {
            width: 100%;
            max-width: 500px;
            background: rgba(5, 15, 25, 0.85);
            backdrop-filter: blur(20px);
            padding: 50px;
            border: 2px solid var(--primary);
            position: relative;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2), inset 0 0 15px rgba(255, 215, 0, 0.1);
            clip-path: polygon(0 0, 92% 0, 100% 8%, 100% 100%, 8% 100%, 0 92%);
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary);
            animation: scan 4s linear infinite;
            z-index: 5;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: white;
            font-size: 45px;
            letter-spacing: 10px;
            font-weight: 900;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .header h1 span {
            color: var(--primary);
        }

        .header p {
            color: var(--primary);
            font-size: 10px;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: white;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.05);
        }

        .btn-access {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: black;
            border: none;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-access:hover {
            background: white;
            box-shadow: 0 0 25px white;
            transform: scale(1.02);
        }

        /* Enlaces de registro y recuperación */
        .auth-links {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        .auth-links a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            transition: 0.3s;
            border-bottom: 1px solid transparent;
        }

        .auth-links a:hover {
            color: var(--primary);
            border-bottom: 1px solid var(--primary);
        }

        .register-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: white;
        }

        .register-text a {
            color: var(--primary);
            font-weight: bold;
            text-decoration: none;
        }

        /* Mensaje de error de credenciales */
        .error-msg {
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid rgba(255, 77, 77, 0.5);
            color: #ff4d4d;
            padding: 12px 16px;
            font-size: 13px;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 20px;
        }

        .ok-msg {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.5);
            color: #4ade80;
            padding: 12px 16px;
            font-size: 13px;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="scan-line"></div>
        
        <div class="header">
            <h1>CAN<span>GUARD</span></h1>
            <p>SISTEMA TÁCTICO K9</p>
        </div>

        <!-- action="/login" method="post" envía los datos al backend de FastAPI -->
        <form action="/login" method="post">

            <!-- Muestra el error si las credenciales son incorrectas -->
            {% if error %}
            <div class="error-msg">⚠ {{ error }}</div>
            {% endif %}

            <!-- Mensaje de éxito (p. ej. después de restablecer la contraseña) -->
            {% if ok %}
            <div class="ok-msg">✔ {{ ok }}</div>
            {% endif %}

            <div class="form-group">
                <label>Nombre de Usuario</label>
                <input type="text" name="username" placeholder="juan.perez" required autocomplete="username">
            </div>

            <div class="form-group">
                <label>Código de Acceso</label>
                <!-- name="password" debe coincidir con el parámetro del Form en main.py -->
                <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-access">Verificar Identidad</button>

            <div class="auth-links">
                <a href="/recuperar">¿Olvidó su clave?</a>
            </div>
        </form>
    </div>

</body>
</html>
