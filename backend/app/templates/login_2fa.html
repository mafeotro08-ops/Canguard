<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANGUARD - Verificación en dos pasos</title>
    <style>
        /* Mismos estilos que recuperar.html para mantener la rejilla y el neón */
        :root {
            --primary: #FFD700;
            --accent: #00f2ff;
            --bg-dark: #020810;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #0a1e30 0%, #020810 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: linear-gradient(rgba(255, 215, 0, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 215, 0, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            top: -50%;
            animation: moveGrid 12s linear infinite;
        }

        @keyframes moveGrid {
            from { background-position: 0 0; }
            to { background-position: 0 500px; }
        }

        .login-card {
            width: 100%;
            max-width: 500px;
            background: rgba(5, 15, 25, 0.85);
            backdrop-filter: blur(20px);
            padding: 50px;
            border: 2px solid var(--primary);
            position: relative;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            clip-path: polygon(0 0, 92% 0, 100% 8%, 100% 100%, 8% 100%, 0 92%);
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary);
            animation: scan 4s linear infinite;
            z-index: 5;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: white; font-size: 35px; letter-spacing: 8px; font-weight: 900; }
        .header h1 span { color: var(--primary); }
        .header p { color: var(--primary); font-size: 10px; letter-spacing: 5px; }

        .form-group { margin-bottom: 25px; }

        .form-group label {
            display: block;
            color: white;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: white;
            outline: none;
        }

        input:focus { border-color: var(--primary); }

        /* Campo de contraseña con botón "ojito" para mostrar/ocultar */
        .pass-wrap { position: relative; }
        .pass-wrap input { padding-right: 50px; }
        .btn-ojo {
            position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
            background: none; border: none; padding: 4px; cursor: pointer;
            color: rgba(255, 255, 255, 0.5); display: flex; transition: color 0.3s;
        }
        .btn-ojo:hover, .btn-ojo:focus-visible { color: var(--primary); outline: none; }
        .btn-ojo svg { width: 20px; height: 20px; }

        .btn-access {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: black;
            border: none;
            font-weight: 900;
            cursor: pointer;
            display: block;
            text-align: center;
            text-decoration: none;
        }

        .register-text { text-align: center; margin-top: 20px; font-size: 13px; color: white; }

        /* Lista de requisitos de la contraseña: se van marcando mientras se escribe */
        .reglas { list-style: none; margin: 10px 0 0; font-size: 11px; color: rgba(255, 255, 255, 0.5); line-height: 18px; }
        .reglas li::before { content: '○ '; }
        .reglas li.ok { color: #4ade80; }
        .reglas li.ok::before { content: '✔ '; }
        .register-text a { color: var(--primary); text-decoration: none; }

        .error-msg {
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid rgba(255, 77, 77, 0.5);
            color: #ff4d4d;
            padding: 12px 16px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <!--
      Segundo paso del inicio de sesión (verificación en dos pasos).
      Solo se llega aquí con la contraseña ya validada (estado pre_2fa en la sesión).
      El mismo campo acepta el código de 6 dígitos de la app o un código de respaldo (ABCD-EFGH).
    -->
    <div class="login-card">
        <div class="scan-line"></div>
        <div class="header">
            <h1>CAN<span>GUARD</span></h1>
            <p>VERIFICACIÓN EN DOS PASOS</p>
        </div>

        <form action="/login/2fa" method="post" autocomplete="off">
            {% if error %}
            <div class="error-msg">⚠ {{ error }}</div>
            {% endif %}
            <p style="font-size: 13px; color: #fff; margin-bottom: 20px; text-align: center; opacity: 0.8;">
                Abre <strong>Google Authenticator</strong> en tu celular y escribe el código de 6 dígitos de
                <strong style="color: var(--primary)">CanGuard K9</strong>.
            </p>
            <div class="form-group">
                <label>Código de verificación</label>
                <input type="text" name="codigo" inputmode="numeric" placeholder="123456" maxlength="9" required autofocus
                    style="text-align:center; font-size:22px; letter-spacing:6px; font-family:Consolas, monospace;">
            </div>
            <button type="submit" class="btn-access">VERIFICAR</button>
            <div class="register-text" style="opacity:0.8; font-size:12px;">
                ¿Sin el celular? Escribe uno de tus códigos de respaldo (ABCD-EFGH).
            </div>
            <div class="register-text"><a href="/login">Regresar al Inicio de Sesión</a></div>
        </form>
    </div>
</body>

</html>
