<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANGUARD - Rescue Key</title>
    <style>
        /* (Mismo bloque de estilos CSS anterior para mantener la rejilla y el neón) */
        :root {
            --primary: #FFD700;
            --accent: #00f2ff;
            --bg-dark: #020810;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #0a1e30 0%, #020810 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: linear-gradient(rgba(255, 215, 0, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 215, 0, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            top: -50%;
            animation: moveGrid 12s linear infinite;
        }

        @keyframes moveGrid {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 0 500px;
            }
        }

        .login-card {
            width: 100%;
            max-width: 500px;
            background: rgba(5, 15, 25, 0.85);
            backdrop-filter: blur(20px);
            padding: 50px;
            border: 2px solid var(--primary);
            position: relative;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            clip-path: polygon(0 0, 92% 0, 100% 8%, 100% 100%, 8% 100%, 0 92%);
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary);
            animation: scan 4s linear infinite;
            z-index: 5;
        }

        @keyframes scan {
            0% {
                top: 0;
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: white;
            font-size: 35px;
            letter-spacing: 8px;
            font-weight: 900;
        }

        .header h1 span {
            color: var(--primary);
        }

        .header p {
            color: var(--primary);
            font-size: 10px;
            letter-spacing: 5px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: white;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: white;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn-access {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: black;
            border: none;
            font-weight: 900;
            cursor: pointer;
        }

        .register-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: white;
        }

        .register-text a {
            color: var(--primary);
            text-decoration: none;
        }

        .ok-msg {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.5);
            color: #4ade80;
            padding: 12px 16px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="scan-line"></div>
        <div class="header">
            <h1>RESCUE <span>KEY</span></h1>
            <p>PROTOCOLO DE RECUPERACIÓN</p>
        </div>
        <!-- Envía el usuario o correo a POST /recuperar (main.py), que manda el enlace por correo -->
        <form action="/recuperar" method="post">
            {% if ok %}
            <div class="ok-msg">✔ {{ ok }}</div>
            {% endif %}
            <p style="font-size: 13px; color: #fff; margin-bottom: 20px; text-align: center; opacity: 0.8;">Ingrese su
                nombre de usuario o correo para recibir un enlace de recuperación.</p>
            <!-- name="identificador" debe coincidir con el parámetro del Form en main.py -->
            <div class="form-group"><label>Usuario o correo</label><input type="text" name="identificador"
                    placeholder="juan.perez o correo@ejemplo.com" required autocomplete="username"></div>
            <button type="submit" class="btn-access">ENVIAR ENLACE</button>
            <div class="register-text"><a href="/login">Regresar al Inicio de Sesión</a></div>
        </form>
    </div>
</body>

</html>
